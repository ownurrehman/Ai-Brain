<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rank Ray Logo Mark -->
  <g transform="translate(20, 20)">
    <!-- Abstract R shape -->
    <path d="M10,10 L35,10 L45,25 L35,40 L10,40 Z" fill="url(#grad1)" />
    <path d="M25,25 L45,25 L55,40 L35,40 Z" fill="#6366f1" opacity="0.8" />
    <!-- Ray lines -->
    <line x1="50" y1="15" x2="70" y2="10" stroke="#6366f1" stroke-width="2" />
    <line x1="50" y1="25" x2="72" y2="25" stroke="#8b5cf6" stroke-width="2" />
    <line x1="50" y1="35" x2="70" y2="40" stroke="#6366f1" stroke-width="2" />
  </g>
  
  <!-- Text -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1f2937">Rank</text>
  <text x="195" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#6366f1">Ray</text>
  
  <!-- Tagline -->
  <text x="100" y="65" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" letter-spacing="2">AGENTIC SEO &amp; AUTOMATION</text>
</svg>